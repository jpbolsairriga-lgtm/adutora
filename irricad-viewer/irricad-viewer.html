/* ---------- top bar ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:1200;display:flex;align-items:center;gap:.5rem;
  padding:calc(env(safe-area-inset-top) + .5rem) .6rem .5rem;background:linear-gradient(180deg,rgba(0,20,30,.92),rgba(0,20,30,0));

/* ---------- overlays ---------- */

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
'use strict';

/* ==================================================================
   MAPA
   ================================================================== */
const mapa = L.map('mapa', {zoomControl:false, attributionControl:false, zoomSnap:.25, wheelPxPerZoomLevel:180});
mapa.setView([-15,-50], 5);
L.control.zoom({position:'bottomleft'}).addTo(mapa);
L.control.attribution({position:'bottomright', prefix:false}).addTo(mapa);

const SERVIDORES_SAT = [
  {nome:'Esri World Imagery', url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'},
  {nome:'Esri (alt)', url:'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'},
  {nome:'Esri Clarity', url:'https://clarity.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'}
];
let iServ=0, camadaSat=null, tileOk=false, erroCount=0;
function montaSatelite(i){
  if(camadaSat) mapa.removeLayer(camadaSat);
  iServ=i; tileOk=false; erroCount=0;
  camadaSat = L.tileLayer(SERVIDORES_SAT[i].url, {maxNativeZoom:19, maxZoom:22, attribution:'Esri, Maxar'});
  camadaSat.on('tileload', ()=>{tileOk=true; erroCount=0;});
  camadaSat.on('tileerror', ()=>{
    if(tileOk) return;
    if(++erroCount>4 && i+1<SERVIDORES_SAT.length){ montaSatelite(i+1); }
  });
  camadaSat.addTo(mapa);
}
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxNativeZoom:19, maxZoom:22, attribution:'OpenStreetMap'});
montaSatelite(0);
let modoRua=false;
function alternaBase(){
  modoRua = !modoRua;
  if(modoRua){ mapa.removeLayer(camadaSat); osm.addTo(mapa); }
  else { mapa.removeLayer(osm); camadaSat.addTo(mapa); }
}
mapa.on('dblclick', ()=>{}); // reservado

/* ==================================================================
   TOAST / LOADING
   ================================================================== */
let toastTimer=null;
function toast(msg, ms){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('mostra');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('mostra'), ms||2600);
}
function mostraCarregando(msg){
  document.getElementById('carregando-txt').textContent = msg || 'Processando arquivo...';
  document.getElementById('carregando').classList.add('aberto');
}
function escondeCarregando(){ document.getElementById('carregando').classList.remove('aberto'); }

/* ==================================================================
   PARSER KML  ->  arvore de pastas com placemarks (geojson-like)
   ================================================================== */
function textoDe(el, tag){
  const n = el.getElementsByTagName(tag)[0];
  return n ? n.textContent.trim() : '';
}
function coordsDeTexto(txt){
  return txt.trim().split(/\s+/).filter(Boolean).map(par=>{
    const p = par.split(',').map(Number);
    return [p[1], p[0]]; // [lat, lon] -- ignora altitude
  }).filter(c=>isFinite(c[0]) && isFinite(c[1]));
}
function corDeKML(kmlColor){
  // KML usa aabbggrr
  if(!kmlColor || kmlColor.length<6) return null;
  const c = kmlColor.length===8 ? kmlColor : '00'+kmlColor;
  const bb = c.slice(2,4), gg = c.slice(4,6), rr = c.slice(6,8);
  return '#'+rr+gg+bb;
}
function extendedDataDe(pm){
  const dados = {};
  const ed = pm.getElementsByTagName('ExtendedData')[0];
  if(ed){
    [...ed.getElementsByTagName('Data')].forEach(d=>{
      const nome = d.getAttribute('name');
      const val = textoDe(d,'value');
      if(nome && val) dados[nome]=val;
    });
    [...ed.getElementsByTagName('SimpleData')].forEach(d=>{
      const nome = d.getAttribute('name');
      const val = d.textContent.trim();
      if(nome && val) dados[nome]=val;
    });
  }
  return dados;
}
function geometriasDePlacemark(pm){
  const geoms = [];
  [...pm.getElementsByTagName('Point')].forEach(g=>{
    const c = g.getElementsByTagName('coordinates')[0];
    if(c){ const arr = coordsDeTexto(c.textContent); if(arr.length) geoms.push({tipo:'point', coords:arr[0]}); }
  });
  [...pm.getElementsByTagName('LineString')].forEach(g=>{
    const c = g.getElementsByTagName('coordinates')[0];
    if(c){ const arr = coordsDeTexto(c.textContent); if(arr.length>1) geoms.push({tipo:'line', coords:arr}); }
  });
  [...pm.getElementsByTagName('Polygon')].forEach(g=>{
    const ob = g.getElementsByTagName('outerBoundaryIs')[0];
    const c = ob ? ob.getElementsByTagName('coordinates')[0] : g.getElementsByTagName('coordinates')[0];
    if(c){
      const anel = coordsDeTexto(c.textContent);
      const buracos = [...g.getElementsByTagName('innerBoundaryIs')].map(ib=>{
        const cc = ib.getElementsByTagName('coordinates')[0];
        return cc ? coordsDeTexto(cc.textContent) : [];
      }).filter(a=>a.length);
      if(anel.length>2) geoms.push({tipo:'polygon', anel, buracos});
    }
  });
  return geoms;
}
function corPadraoPasta(nome){
  // paleta simples e estavel a partir do nome da pasta
  let h=0; for(let i=0;i<nome.length;i++) h = (h*31 + nome.charCodeAt(i)) & 0xffffffff;
  const hue = Math.abs(h) % 360;
  return `hsl(${hue},70%,55%)`;
}
function parseKMLTree(texto){
  const doc = new DOMParser().parseFromString(texto, 'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('Arquivo KML inválido ou corrompido.');

  // resolve estilos simples (cor de linha) por #id
  const estilos = {};
  [...doc.getElementsByTagName('Style')].forEach(st=>{
    const id = st.getAttribute('id');
    if(!id) return;
    const ls = st.getElementsByTagName('LineStyle')[0];
    const ps = st.getElementsByTagName('PolyStyle')[0];
    estilos['#'+id] = {
      linha: ls ? corDeKML(textoDe(ls,'color')) : null,
      preench: ps ? corDeKML(textoDe(ps,'color')) : null
    };
  });

  function corDoPlacemark(pm){
    const su = textoDe(pm,'styleUrl');
    if(su && estilos[su]) return estilos[su];
    return null;
  }

  function montaPasta(el, caminho){
    const nomePasta = textoDe(el,'name') || 'Sem nome';
    const meuCaminho = caminho ? caminho+' / '+nomePasta : nomePasta;
    const pasta = {nome:nomePasta, caminho:meuCaminho, subpastas:[], placemarks:[]};
    // subpastas diretas (Folder e Document filhos diretos)
    for(const filho of el.children){
      if(filho.tagName==='Folder' || filho.tagName==='Document'){
        pasta.subpastas.push(montaPasta(filho, meuCaminho));
      } else if(filho.tagName==='Placemark'){
        const geoms = geometriasDePlacemark(filho);
        if(!geoms.length) continue;
        const estilo = corDoPlacemark(filho);
        pasta.placemarks.push({
          nome: textoDe(filho,'name') || '',
          descricao: textoDe(filho,'description') || '',
          dados: extendedDataDe(filho),
          geoms,
          cor: (estilo && (estilo.linha || estilo.preench)) || null
        });
      }
    }
    return pasta;
  }

  const raiz = doc.documentElement;
  // acha o(s) Document/Folder de nivel superior dentro de <kml>
  const topEls = [...raiz.children].filter(c=>c.tagName==='Document' || c.tagName==='Folder');
  const arvore = topEls.length ? topEls.map(e=>montaPasta(e,'')) : [montaPasta(raiz,'')];
  return arvore;
}

/* achata a arvore em lista de "camadas" (uma por pasta que tem placemarks OU subpastas com placemarks, priorizando o nivel mais alto que ja tenha geometria propria) */
function achataCamadas(arvore){
  const camadas = [];
  function rec(pasta){
    if(pasta.placemarks.length){
      camadas.push(pasta);
    }
    pasta.subpastas.forEach(rec);
  }
  arvore.forEach(rec);
  return camadas;
}

/* ==================================================================
   REGRAS DE VISIBILIDADE PADRAO
   Muitas pastas exportadas de CAD (perfis, seções, grades, tabelas)
   são ruído em campo. Ficam ocultas por padrão, mas continuam
   disponíveis na gaveta de camadas.
   ================================================================== */
const OCULTAR_POR_PADRAO = /(PROF|SECT|SCTN|MASS|GRID|TABL|VIEW|DIAG|CANT|SAMP|SPIR|CURV$|ASSM|STAN|SGHT|TURNOUT|FOUNDATION|GIRDER|ABUTMENT|PIER|Defpoints|CONFRONTANTE|AZIMUTE|DIMENS)/i;
const REALCAR = /(TALH|WATR-PIPE|WATR-FITT|PROP-BNDY|PROP-LINE|LOTE|ADUTORA|C-WATR)/i;

/* ==================================================================
   ESTADO DO PROJETO ATUAL
   ================================================================== */
let grupoCamadas = []; // {info:pastaObj, layer:L.LayerGroup, cor, visivel}
let projetoAtual = null; // {id, nome, ts}

function limparProjeto(){
  grupoCamadas.forEach(c=>mapa.removeLayer(c.layer));
  grupoCamadas = [];
  document.getElementById('lista-camadas').innerHTML = '<div id="drawer-empty">Abra um projeto para ver as camadas.</div>';
}

// muitas exportacoes de CAD nomeiam toda geometria como "POLYLINE"/"Placemark";
// nesses casos usa o nome da camada + um numero sequencial, senao fica tudo igual.
const NOME_GENERICO = /^(polyline|placemark|path|untitled ?path|point|line)$/i;
function rotuloPlacemark(pm, idxNaCamada, nomeCamada){
  if(pm.nome && !NOME_GENERICO.test(pm.nome.trim())) return pm.nome;
  return nomeCamada + ' #' + (idxNaCamada+1);
}

function popupHTML(pm, tipoLabel, rotulo){
  let h = '';
  h += `<b>${escHTML(rotulo || pm.nome || tipoLabel || 'Elemento')}</b>`;
  if(tipoLabel) h += `<br><small style="color:#5a7a88">${tipoLabel}</small>`;
  const chaves = Object.keys(pm.dados||{});
  if(chaves.length){
    h += '<table style="margin-top:.4rem;font-size:.78rem;border-collapse:collapse">';
    chaves.slice(0,12).forEach(k=>{
      h += `<tr><td style="color:#5a7a88;padding-right:.5rem;vertical-align:top">${escHTML(k)}</td><td>${escHTML(pm.dados[k])}</td></tr>`;
    });
    h += '</table>';
  } else if(pm.descricao){
    h += `<div style="margin-top:.3rem">${pm.descricao.replace(/</g,'&lt;')}</div>`;
  }
  return h || '<i>Sem nome</i>';
}
function escHTML(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function construirCamadas(arvore){
  limparProjeto();
  const camadasPastas = achataCamadas(arvore);
  const bounds = L.latLngBounds([]);

  camadasPastas.forEach(pasta=>{
    const corPasta = corDeKML_ouPadrao(pasta);
    const layer = L.layerGroup();
    let count=0;

    pasta.placemarks.forEach((pm,idxPm)=>{
      const cor = pm.cor || corPasta;
      const rotulo = rotuloPlacemark(pm, idxPm, pasta.nome);
      pm.geoms.forEach(g=>{
        let obj=null;
        if(g.tipo==='point'){
          obj = L.circleMarker([g.coords[0],g.coords[1]], {radius:5, color:'#fff', weight:1.5, fillColor:cor, fillOpacity:.95});
          bounds.extend([g.coords[0],g.coords[1]]);
        } else if(g.tipo==='line'){
          obj = L.polyline(g.coords, {color:cor, weight:3, opacity:.9});
          g.coords.forEach(c=>bounds.extend(c));
        } else if(g.tipo==='polygon'){
          const anel = [g.anel, ...g.buracos];
          obj = L.polygon(anel, {color:cor, weight:2, fillColor:cor, fillOpacity:.18});
          g.anel.forEach(c=>bounds.extend(c));
        }
        if(obj){
          obj.bindPopup(popupHTML(pm, pasta.nome, rotulo));
          layer.addLayer(obj);
          count++;
        }
      });
    });

    if(count===0) return;
    const ocultarPadrao = OCULTAR_POR_PADRAO.test(pasta.caminho) && !REALCAR.test(pasta.caminho);
    grupoCamadas.push({pasta, layer, cor:corPasta, count, visivel:!ocultarPadrao});
  });

  // ordena: realcadas primeiro, depois alfabetico
  grupoCamadas.sort((a,b)=>{
    const ra = REALCAR.test(a.pasta.caminho) ? 0 : 1;
    const rb = REALCAR.test(b.pasta.caminho) ? 0 : 1;
    if(ra!==rb) return ra-rb;
    return a.pasta.nome.localeCompare(b.pasta.nome,'pt-BR');
  });

  grupoCamadas.forEach(c=>{ if(c.visivel) c.layer.addTo(mapa); });

  if(bounds.isValid()){ mapa.fitBounds(bounds, {padding:[30,30]}); }
  renderizaListaCamadas();
}
function corDeKML_ouPadrao(pasta){
  return corPadraoPasta(pasta.caminho);
}

function renderizaListaCamadas(){
  const cont = document.getElementById('lista-camadas');
  if(!grupoCamadas.length){ cont.innerHTML = '<div id="drawer-empty">Nenhuma camada com geometria neste arquivo.</div>'; return; }
  cont.innerHTML = '';
  grupoCamadas.forEach((c,i)=>{
    const div = document.createElement('div');
    div.className = 'camada-item';
    div.innerHTML = `<span class="swatch" style="background:${c.cor}"></span>
      <label for="cam-${i}">${escHTML(c.pasta.nome)}<br><small>${c.count} elemento${c.count>1?'s':''}</small></label>
      <input type="checkbox" id="cam-${i}" ${c.visivel?'checked':''}>`;
    div.querySelector('input').addEventListener('change', e=>{
      c.visivel = e.target.checked;
      if(c.visivel) c.layer.addTo(mapa); else mapa.removeLayer(c.layer);
    });
    cont.appendChild(div);
  });
}

/* ==================================================================
   LEITURA DE ARQUIVO (.kml / .kmz)
   ================================================================== */
async function abrirArquivo(file){
  mostraCarregando('Lendo ' + file.name + '...');
  try{
    const buf = await file.arrayBuffer();
    const arvore = parseKMLTree(await extraiTextoKML(file, buf));
    construirCamadas(arvore);
    definirTituloProjeto(file.name);
    await salvarProjetoIndexedDB(file.name, buf);
    toast('Projeto carregado: ' + file.name);
  }catch(err){
    console.error(err);
    toast('Erro: ' + err.message, 4200);
  }finally{
    escondeCarregando();
  }
}
function decodeTextoInteligente(buf){
  // Muitos exportadores de CAD (inclusive o do IrriCAD) gravam o KML em
  // Windows-1252 sem declarar o encoding. Tenta UTF-8 estrito primeiro;
  // se houver byte invalido, cai para Windows-1252.
  try{ return new TextDecoder('utf-8', {fatal:true}).decode(buf); }
  catch(e){ return new TextDecoder('windows-1252').decode(buf); }
}
async function extraiTextoKML(file, buf){
  const ext = file.name.toLowerCase().split('.').pop();
  if(ext==='kmz'){
    const zip = await JSZip.loadAsync(buf);
    const alvo = Object.keys(zip.files).find(n=>n.toLowerCase().endsWith('.kml'));
    if(!alvo) throw new Error('O arquivo .kmz não contém nenhum .kml dentro.');
    const kmlBuf = await zip.files[alvo].async('arraybuffer');
    return decodeTextoInteligente(kmlBuf);
  }
  if(ext==='kml') return decodeTextoInteligente(buf);
  throw new Error('Formato não suportado. Use .kml ou .kmz.');
}
function definirTituloProjeto(nome){
  const el = document.getElementById('titulo-proj');
  el.classList.remove('vazio');
  const n = grupoCamadas.reduce((s,c)=>s+c.count,0);
  el.innerHTML = `<b>${escHTML(nome.replace(/\.(kmz|kml)$/i,''))}</b><span>${grupoCamadas.length} camadas &middot; ${n} elementos</span>`;
}

/* ==================================================================
   PERSISTENCIA (IndexedDB) -- "Meus projetos"
   ================================================================== */
const DB_NOME = 'irricadViewerDB', DB_VERSAO = 1, STORE = 'projetos';
function abrirDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NOME, DB_VERSAO);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, {keyPath:'id'});
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function salvarProjetoIndexedDB(nome, buf){
  try{
    const db = await abrirDB();
    const id = nome; // um arquivo com mesmo nome substitui a versao salva
    const registro = {id, nome, ts:Date.now(), buf};
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE,'readwrite');
      tx.objectStore(STORE).put(registro);
      tx.oncomplete = resolve; tx.onerror=()=>reject(tx.error);
    });
    projetoAtual = {id, nome, ts:registro.ts};
  }catch(e){ console.warn('Não foi possível salvar offline:', e); }
}
async function listarProjetosSalvos(){
  const db = await abrirDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE,'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = ()=>resolve(req.result.sort((a,b)=>b.ts-a.ts));
    req.onerror = ()=>reject(req.error);
  });
}
async function excluirProjetoSalvo(id){
  const db = await abrirDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = resolve; tx.onerror=()=>reject(tx.error);
  });
}
async function abrirProjetoSalvo(registro){
  mostraCarregando('Abrindo ' + registro.nome + '...');
  try{
    const file = new File([registro.buf], registro.nome);
    const arvore = parseKMLTree(await extraiTextoKML(file, registro.buf));
    construirCamadas(arvore);
    definirTituloProjeto(registro.nome);
    projetoAtual = {id:registro.id, nome:registro.nome, ts:registro.ts};
    toast('Projeto aberto: ' + registro.nome);
    fecharDrawerProjetos();
  }catch(err){
    console.error(err);
    toast('Erro ao abrir projeto salvo: ' + err.message, 4200);
  }finally{
    escondeCarregando();
  }
}
async function renderizaListaProjetos(){
  const cont = document.getElementById('dp-lista');
  let lista;
  try{ lista = await listarProjetosSalvos(); }catch(e){ lista=[]; }
  if(!lista.length){ cont.innerHTML = '<div id="dp-empty">Nenhum projeto salvo neste aparelho ainda.</div>'; return; }
  cont.innerHTML = '';
  lista.forEach(reg=>{
    const div = document.createElement('div');
    div.className = 'proj-item';
    const data = new Date(reg.ts).toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    div.innerHTML = `<div class="info"><b>${escHTML(reg.nome)}</b><small>${data} &middot; ${(reg.buf.byteLength/1024/1024).toFixed(1)} MB</small></div><button class="del" title="Excluir">&#128465;&#65039;</button>`;
    div.querySelector('.info').addEventListener('click', ()=>abrirProjetoSalvo(reg));
    div.querySelector('.del').addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(confirm('Excluir "'+reg.nome+'" deste aparelho?')){
        await excluirProjetoSalvo(reg.id);
        renderizaListaProjetos();
      }
    });
    cont.appendChild(div);
  });
}

// busca
const buscaBar = document.getElementById('buscabar');
const buscaInput = document.getElementById('busca-input');
const buscaResultados = document.getElementById('busca-resultados');
document.getElementById('btn-busca').addEventListener('click', ()=>{
  buscaBar.classList.toggle('aberto');
  if(buscaBar.classList.contains('aberto')) buscaInput.focus();
  else { buscaResultados.classList.remove('aberto'); }
});
buscaInput.addEventListener('input', ()=>{
  const q = buscaInput.value.trim().toLowerCase();
  if(!q){ buscaResultados.classList.remove('aberto'); buscaResultados.innerHTML=''; return; }
  const achados = [];
  grupoCamadas.forEach(c=>{
    c.pasta.placemarks.forEach((pm,idx)=>{
      const rotulo = rotuloPlacemark(pm, idx, c.pasta.nome);
      const valores = Object.values(pm.dados||{}).join(' ').toLowerCase();
      if(rotulo.toLowerCase().includes(q) || c.pasta.nome.toLowerCase().includes(q) || valores.includes(q)){
        achados.push({pm, camada:c, rotulo});
      }
    });
  });
  buscaResultados.innerHTML = achados.slice(0,40).map((a,i)=>
    `<div class="busca-item" data-i="${i}"><span>${escHTML(a.rotulo)}</span><small>${escHTML(a.camada.pasta.nome)}</small></div>`
  ).join('') || '<div class="busca-item"><span>Nada encontrado</span></div>';
  if(achados.length>40) buscaResultados.innerHTML += `<div class="busca-item"><small>+ ${achados.length-40} resultado(s)... refine a busca</small></div>`;
  buscaResultados.classList.add('aberto');
  [...buscaResultados.children].forEach((el,i)=>{
    if(!achados[i]) return;
    el.addEventListener('click', ()=>{
      const pm = achados[i].pm;
      const g = pm.geoms[0];
      let ll=null;
      if(g.tipo==='point') ll=[g.coords[0],g.coords[1]];
      else if(g.tipo==='line') ll=g.coords[Math.floor(g.coords.length/2)];
      else if(g.tipo==='polygon') ll=L.polygon(g.anel).getBounds().getCenter();
      if(ll){ mapa.setView(ll, Math.max(mapa.getZoom(),17)); }
      buscaBar.classList.remove('aberto'); buscaResultados.classList.remove('aberto'); buscaInput.value='';
    });
  });
});

/* ==================================================================
   GPS
   ================================================================== */
let marcadorGPS=null, circuloGPS=null, watchId=null, seguindo=false;
function ativaGPS(){
  if(!navigator.geolocation){ toast('GPS não disponível neste dispositivo.'); return; }
  document.getElementById('btn-gps').classList.add('ativo');
  navigator.geolocation.getCurrentPosition(pos=>{
    atualizaGPS(pos);
    mapa.setView([pos.coords.latitude,pos.coords.longitude], Math.max(mapa.getZoom(),17));
  }, err=>toast('Não foi possível obter localização: '+err.message, 3500), {enableHighAccuracy:true, timeout:10000});
  if(watchId==null){
    watchId = navigator.geolocation.watchPosition(atualizaGPS, ()=>{}, {enableHighAccuracy:true, maximumAge:2000});
  }
}
function atualizaGPS(pos){
  const ll = [pos.coords.latitude, pos.coords.longitude];
  if(!marcadorGPS){
    marcadorGPS = L.circleMarker(ll, {radius:8, color:'#fff', weight:2, fillColor:'#1a73e8', fillOpacity:1}).addTo(mapa);
    circuloGPS = L.circle(ll, {radius:pos.coords.accuracy, color:'#1a73e8', weight:1, fillColor:'#1a73e8', fillOpacity:.12}).addTo(mapa);
  } else {
    marcadorGPS.setLatLng(ll);
    circuloGPS.setLatLng(ll); circuloGPS.setRadius(pos.coords.accuracy);
  }
  if(seguindo) mapa.setView(ll, mapa.getZoom());
}
document.getElementById('btn-gps').addEventListener('click', ativaGPS);
document.getElementById('btn-seguir').addEventListener('click', ()=>{
  seguindo = !seguindo;
  document.getElementById('btn-seguir').classList.toggle('ativo', seguindo);
  if(seguindo){ if(!marcadorGPS) ativaGPS(); toast('Seguindo sua posição'); }
});

/* ==================================================================
   MEDIR DISTANCIA
   ================================================================== */
let medindo=false, pontosMedicao=[], linhaMedicao=null, marcadoresMedicao=[];
function metrosEntre(a,b){ return mapa.distance(a,b); }
function atualizaMedicao(){
  const info = document.getElementById('med-info');
  if(pontosMedicao.length<1){ info.classList.remove('aberto'); return; }
  let total=0;
  for(let i=1;i<pontosMedicao.length;i++) total += metrosEntre(pontosMedicao[i-1], pontosMedicao[i]);
  info.textContent = (total<1000 ? total.toFixed(0)+' m' : (total/1000).toFixed(2)+' km') + (pontosMedicao.length>1 ? ' · toque para continuar, botão de novo para terminar' : ' · toque no mapa para medir');
  info.classList.add('aberto');
  if(linhaMedicao) mapa.removeLayer(linhaMedicao);
  if(pontosMedicao.length>1) linhaMedicao = L.polyline(pontosMedicao, {color:'#ffb703', weight:3, dashArray:'6,6'}).addTo(mapa);
}
function cliqueMedicao(e){
  const ll = [e.latlng.lat, e.latlng.lng];
  pontosMedicao.push(ll);
  const m = L.circleMarker(ll, {radius:5, color:'#fff', weight:1.5, fillColor:'#ffb703', fillOpacity:1}).addTo(mapa);
  marcadoresMedicao.push(m);
  atualizaMedicao();
}
document.getElementById('btn-medir').addEventListener('click', ()=>{
  medindo = !medindo;
  document.getElementById('btn-medir').classList.toggle('ativo', medindo);
  if(medindo){
    toast('Toque no mapa para marcar pontos e medir a distância');
    mapa.on('click', cliqueMedicao);
  } else {
    mapa.off('click', cliqueMedicao);
    pontosMedicao=[];
    marcadoresMedicao.forEach(m=>mapa.removeLayer(m)); marcadoresMedicao=[];
    if(linhaMedicao){ mapa.removeLayer(linhaMedicao); linhaMedicao=null; }
    document.getElementById('med-info').classList.remove('aberto');
  }
});
